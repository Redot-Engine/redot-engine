name: 📊 Static Checks
on:
  workflow_call:

env:
  DISABLE_REDOT_GET_CHANGED_FILES: false

jobs:
  static-checks:
    name: Code style, file formatting, and docs
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      # This needs to happen before Python and npm execution; it must happen before any extra files are written.
      - name: .gitignore checks (gitignore_check.sh)
        run: |
          bash ./misc/scripts/gitignore_check.sh

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install pre-commit
        run: python -m pip install pre-commit==4.6.2

      - name: Test lint scope selection
        run: python tests/python_build/test_ci_lint.py

      - name: Style checks via pre-commit
        env:
          LINT_ALL_FILES: ${{ env.DISABLE_REDOT_GET_CHANGED_FILES }}
        run: python misc/scripts/ci_lint.py

      - name: Class reference schema checks
        run: |
          sudo apt-get update
          sudo apt-get install libxml2-utils
          xmllint --quiet --noout --schema doc/class.xsd doc/classes/*.xml modules/*/doc_classes/*.xml platform/*/doc_classes/*.xml

      - name: Run C compiler on `gdextension_interface.h`
        run: |
          gcc -c core/extension/gdextension_interface.h
