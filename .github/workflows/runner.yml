name: 🔗 GHA
on: [push, pull_request, merge_group]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}|${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  # First stage: Only static checks, fast and prevent expensive builds from running.

  static-checks:
    if: ${{ !vars.DISABLE_GODOT_CI || github.run_attempt > 1 }}
    name: 📊 Static checks
    uses: ./.github/workflows/static_checks.yml

  # Second stage: Run all the builds and some of the tests.

  # macOS / iOS / Android builds are paused while the PhysX port is being
  # stabilized on desktop platforms. To re-enable: repo Settings ->
  # Secrets and variables -> Actions -> Variables -> add
  # ENABLE_MAC_IOS_ANDROID = true (delete the variable to pause again).
  android-build:
    name: 🤖 Android
    needs: static-checks
    if: ${{ vars.ENABLE_MAC_IOS_ANDROID == 'true' }}
    uses: ./.github/workflows/android_builds.yml

  ios-build:
    name: 🍏 iOS
    needs: static-checks
    if: ${{ vars.ENABLE_MAC_IOS_ANDROID == 'true' }}
    uses: ./.github/workflows/ios_builds.yml

  linux-build:
    name: 🐧 Linux
    needs: static-checks
    uses: ./.github/workflows/linux_builds.yml

  macos-build:
    name: 🍎 macOS
    needs: static-checks
    if: ${{ vars.ENABLE_MAC_IOS_ANDROID == 'true' }}
    uses: ./.github/workflows/macos_builds.yml

  windows-build:
    name: 🏁 Windows
    needs: static-checks
    uses: ./.github/workflows/windows_builds.yml

  web-build:
    name: 🌐 Web
    needs: static-checks
    # Paused like macOS/iOS/Android above; re-enable via repo variable
    # ENABLE_WEB_BUILDS = true (Settings -> Secrets and variables -> Actions).
    if: ${{ vars.ENABLE_WEB_BUILDS == 'true' }}
    uses: ./.github/workflows/web_builds.yml
