name: 🍎 macOS Builds
on:
  workflow_call:
    inputs:
      job-name:
        type: string
        required: true
      target:
        type: string
        required: true
      artifact-name:
        type: string
        required: true
      scons-flags:
        type: string
        default: ""

# Global Settings
env:
  SCONS_FLAGS: >-
    dev_mode=yes
    module_text_server_fb_enabled=yes
    "accesskit_sdk_path=${{ github.workspace }}/accesskit-c-0.17.0/"

jobs:
  build-macos:
    runs-on: macos-latest
    name: Compile ${{ inputs.target }} (${{ matrix.arch }})
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.0.1.app

      - name: Restore Godot build cache
        uses: ./.github/actions/godot-cache-restore
        with:
          cache-name: ${{ inputs.artifact-name }}-${{ matrix.arch }}
        continue-on-error: true

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Download pre-built AccessKit
        uses: dsaltares/fetch-gh-release-asset@1.1.2
        with:
          repo: AccessKit/accesskit-c
          version: tags/0.17.0
          file: accesskit-c-0.17.0.zip
          target: accesskit-c-0.17.0/accesskit_c.zip

      - name: Extract pre-built AccessKit
        run: unzip -o accesskit-c-0.17.0/accesskit_c.zip

      - name: Setup Vulkan SDK
        id: vulkan-sdk
        run: |
          if sh misc/scripts/install_vulkan_sdk_macos.sh; then
            echo "VULKAN_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::macOS: Vulkan SDK installation failed, building without Vulkan support."
            echo "VULKAN_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi
        continue-on-error: true

      - name: Compilation
        uses: ./.github/actions/godot-build
        with:
          scons-flags: ${{ env.SCONS_FLAGS }} ${{ inputs.scons-flags }} arch=${{ matrix.arch }} vulkan=${{ steps.vulkan-sdk.outputs.VULKAN_ENABLED }}
          platform: macos
          target: ${{ inputs.target }}

      - name: Save Godot build cache
        uses: ./.github/actions/godot-cache-save
        with:
          cache-name: ${{ inputs.artifact-name }}-${{ matrix.arch }}
        continue-on-error: true

      - name: Upload architecture binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}-slice-${{ matrix.arch }}
          path: bin/redot.macos.${{ inputs.target }}.${{ matrix.arch }}
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  package-macos:
    needs: build-macos
    if: ${{ !cancelled() }}
    runs-on: macos-latest
    name: ${{ inputs.job-name }}
    timeout-minutes: 15
    env:
      BIN_BASE: ./bin/redot.macos.${{ inputs.target }}

    steps:
      - name: Require successful builds
        if: needs.build-macos.result != 'success'
        run: |
          echo "::error::Both architecture builds must succeed before packaging."
          exit 1

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.0.1.app

      - name: Download architecture binaries
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ inputs.artifact-name }}-slice-*
          path: bin
          merge-multiple: true

      - name: Create universal binary
        run: |
          lipo -create "$BIN_BASE.x86_64" "$BIN_BASE.arm64" -output "$BIN_BASE.universal"
          lipo -verify_arch x86_64 arm64 "$BIN_BASE.universal"
          strip "$BIN_BASE.universal"
          chmod +x "$BIN_BASE.universal"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}
          path: bin/redot.macos.${{ inputs.target }}.universal
          if-no-files-found: error
          overwrite: true
          retention-days: 60

      - name: Unit tests
        run: |
          "$BIN_BASE.universal" --version
          "$BIN_BASE.universal" --help
          "$BIN_BASE.universal" --test --force-colors
