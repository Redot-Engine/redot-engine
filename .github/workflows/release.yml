name: Build Redot Project

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. RD_26.3-RC4_Px5.11_B002). Empty = timestamp tag (YYYYMMDDHH) as before.'
        required: false
        type: string
        default: ''

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            scons \
            pkg-config \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            build-essential \
            gcc \
            g++ \
            python3

      - name: Build Redot Project for Linux
        run: |
          scons platform=linuxbsd production=yes
          rm -rf bin/obj

      - name: Upload Linux dev artifact
        uses: actions/upload-artifact@v7
        with:
          name: redot-linux-dev
          path: bin

  build-linux-template:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            scons \
            pkg-config \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            build-essential \
            gcc \
            g++ \
            python3

      - name: Build Redot Templates for Linux
        run: |
          scons platform=linuxbsd target=template_release physx_config=release
          rm -rf bin/obj

      - name: Upload Linux Template Artifact
        uses: actions/upload-artifact@v7
        with:
          name: redot-linux-template
          path: bin

  build-linux-editor-mono:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             scons             pkg-config             libx11-dev             libxcursor-dev             libxrandr-dev             libxi-dev             libxinerama-dev             libgl1-mesa-dev             libglu1-mesa-dev             build-essential             gcc             g++             python3

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build Redot Editor for Linux (Mono)
        run: |
          scons platform=linuxbsd production=yes module_mono_enabled=yes
          rm -rf bin/obj

      - name: Generate Mono Glue
        run: |
          ./bin/redot.linuxbsd.editor.x86_64.mono --headless --generate-mono-glue modules/mono/glue

      - name: Build GodotSharp
        run: |
          python modules/mono/build_scripts/build_assemblies.py --godot-output-dir=./bin

      - name: Upload Linux Mono editor artifact
        uses: actions/upload-artifact@v7
        with:
          name: redot-linux-editor-mono
          path: bin

  build-linux-template-mono:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             scons             pkg-config             libx11-dev             libxcursor-dev             libxrandr-dev             libxi-dev             libgl1-mesa-dev             libglu1-mesa-dev             build-essential             gcc             g++             python3

      - name: Build Redot Mono Template for Linux
        run: |
          scons platform=linuxbsd target=template_release physx_config=release module_mono_enabled=yes
          rm -rf bin/obj

      - name: Upload Linux Mono Template artifact
        uses: actions/upload-artifact@v7
        with:
          name: redot-linux-template-mono
          path: bin

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Setup Scoop
        uses: MinoruSekine/setup-scoop@v4.0.1
        with:
          buckets: extras
          apps: gcc python scons make mingw

      - name: Build Redot Project for Windows
        run: |
          scons platform=windows production=yes
          Remove-Item -Recurse -Force bin/obj -ErrorAction SilentlyContinue

      - name: Upload Windows dev artifact
        uses: actions/upload-artifact@v7
        with:
          name: redot-windows-dev
          path: bin

  build-windows-template:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Setup Scoop
        uses: MinoruSekine/setup-scoop@v4.0.1
        with:
          buckets: extras
          apps: gcc python scons make mingw

      - name: Build Redot Templates for Windows
        run: |
          scons platform=windows target=template_release physx_config=release
          Remove-Item -Recurse -Force bin/obj -ErrorAction SilentlyContinue

      - name: Upload Windows Template Artifact
        uses: actions/upload-artifact@v7
        with:
          name: redot-windows-template
          path: bin

  build-windows-editor-mono:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Setup Scoop
        uses: MinoruSekine/setup-scoop@v4.0.1
        with:
          buckets: extras
          apps: gcc python scons make mingw

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build Redot Editor for Windows (Mono)
        run: |
          scons platform=windows production=yes module_mono_enabled=yes
          Remove-Item -Recurse -Force bin/obj -ErrorAction SilentlyContinue

      - name: Generate Mono Glue
        run: |
          ./bin/redot.windows.editor.x86_64.mono.exe --headless --generate-mono-glue modules/mono/glue

      - name: Build GodotSharp
        run: |
          python modules/mono/build_scripts/build_assemblies.py --godot-output-dir=./bin

      - name: Upload Windows Mono editor artifact
        uses: actions/upload-artifact@v7
        with:
          name: redot-windows-editor-mono
          path: bin

  build-windows-template-mono:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Setup Scoop
        uses: MinoruSekine/setup-scoop@v4.0.1
        with:
          buckets: extras
          apps: gcc python scons make mingw

      - name: Build Redot Mono Template for Windows
        run: |
          scons platform=windows target=template_release physx_config=release module_mono_enabled=yes
          Remove-Item -Recurse -Force bin/obj -ErrorAction SilentlyContinue

      - name: Upload Windows Mono Template artifact
        uses: actions/upload-artifact@v7
        with:
          name: redot-windows-template-mono
          path: bin

  build-macos-x64:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          lfs: true
      - name: Setup Vulkan SDK
        run: |
          sh misc/scripts/install_vulkan_sdk_macos.sh
      - name: Install Dependencies
        run: |
          brew install scons pkg-config

      - name: Build Redot Project for macOS x64
        run: |
          scons platform=macos arch=x64 production=yes
          rm -rf bin/obj

      - name: Upload macOS x64 dev artifact
        uses: actions/upload-artifact@v7
        with:
          name: redot-macos-x64-dev
          path: bin

  build-macos-arm64:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Setup Vulkan SDK
        run: |
          sh misc/scripts/install_vulkan_sdk_macos.sh
      - name: Install Dependencies
        run: |
          brew install scons pkg-config

      - name: Build Redot Project for macOS arm64
        run: |
          scons platform=macos arch=arm64 production=yes
          rm -rf bin/obj

      - name: Upload macOS arm64 dev artifact
        uses: actions/upload-artifact@v7
        with:
          name: redot-macos-arm64-dev
          path: bin

  build-macos-x64-template:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          lfs: true
      - name: Setup Vulkan SDK
        run: |
          sh misc/scripts/install_vulkan_sdk_macos.sh
      - name: Install Dependencies
        run: |
          brew install scons pkg-config

      - name: Build Redot Templates for macOS x64
        run: |
          scons platform=macos arch=x64 target=template_release physx_config=release
          rm -rf bin/obj

      - name: Upload macOS x64 Template Artifact
        uses: actions/upload-artifact@v7
        with:
          name: redot-macos-x64-template
          path: bin

  build-macos-arm64-template:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          lfs: true
      - name: Setup Vulkan SDK
        run: |
          sh misc/scripts/install_vulkan_sdk_macos.sh
      - name: Install Dependencies
        run: |
          brew install scons pkg-config

      - name: Build Redot Templates for macOS arm64
        run: |
          scons platform=macos arch=arm64 target=template_release physx_config=release
          rm -rf bin/obj

      - name: Upload macOS arm64 Template Artifact
        uses: actions/upload-artifact@v7
        with:
          name: redot-macos-arm64-template
          path: bin

  release:
    needs: [build-linux, build-linux-template, build-linux-editor-mono, build-linux-template-mono, build-windows, build-windows-template, build-windows-editor-mono, build-windows-template-mono, build-macos-x64, build-macos-arm64, build-macos-x64-template, build-macos-arm64-template]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Linux dev artifact
        uses: actions/download-artifact@v8
        with:
          name: redot-linux-dev
          path: redot-linux-dev

      - name: Download Windows dev artifact
        uses: actions/download-artifact@v8
        with:
          name: redot-windows-dev
          path: redot-windows-dev

      - name: Download Linux template artifact
        uses: actions/download-artifact@v8
        with:
          name: redot-linux-template
          path: redot-linux-template

      - name: Download Windows template artifact
        uses: actions/download-artifact@v8
        with:
          name: redot-windows-template
          path: redot-windows-template

      - name: Download macOS x64 dev artifact
        uses: actions/download-artifact@v8
        with:
          name: redot-macos-x64-dev
          path: redot-macos-x64-dev

      - name: Download macOS arm64 dev artifact
        uses: actions/download-artifact@v8
        with:
          name: redot-macos-arm64-dev
          path: redot-macos-arm64-dev

      - name: Download macOS x64 template artifact
        uses: actions/download-artifact@v8
        with:
          name: redot-macos-x64-template
          path: redot-macos-x64-template

      - name: Download macOS arm64 template artifact
        uses: actions/download-artifact@v8
        with:
          name: redot-macos-arm64-template
          path: redot-macos-arm64-template

      - name: Download Linux Mono editor artifact
        uses: actions/download-artifact@v8
        with:
          name: redot-linux-editor-mono
          path: redot-linux-editor-mono

      - name: Download Linux Mono template artifact
        uses: actions/download-artifact@v8
        with:
          name: redot-linux-template-mono
          path: redot-linux-template-mono

      - name: Download Windows Mono editor artifact
        uses: actions/download-artifact@v8
        with:
          name: redot-windows-editor-mono
          path: redot-windows-editor-mono

      - name: Download Windows Mono template artifact
        uses: actions/download-artifact@v8
        with:
          name: redot-windows-template-mono
          path: redot-windows-template-mono

      - name: Get the current date
        id: date
        run: echo "CURRENT_DATE=$(date +'%Y%m%d%H')" >> $GITHUB_ENV

      - name: Zip the dev artifact
        run: |
          zip -r -9 redot-linuxbsd.zip redot-linux-dev/*
          zip -r -9 redot-windowsx64.zip redot-windows-dev/*
          zip -r -9 redot-macos-x64.zip redot-macos-x64-dev/*
          zip -r -9 redot-macos-arm64.zip redot-macos-arm64-dev/*
          zip -r -9 redot-linux-template.zip redot-linux-template/*
          zip -r -9 redot-linux-mono.zip redot-linux-editor-mono/*
          zip -r -9 redot-linux-template-mono.zip redot-linux-template-mono/*
          zip -r -9 redot-windows-template.zip redot-windows-template/*
          zip -r -9 redot-windows-mono.zip redot-windows-editor-mono/*
          zip -r -9 redot-windows-template-mono.zip redot-windows-template-mono/*
          zip -r -9 redot-macos-x64-template.zip redot-macos-x64-template/*
          zip -r -9 redot-macos-arm64-template.zip redot-macos-arm64-template/*

      # - name: Upload release artifacts
      #   uses: actions/upload-artifact@v7
      #   with:
      #     name: redot-release-${{ env.CURRENT_DATE }}
      #     path: |
      #       redot-linuxbsd.zip
      #       redot-windowsx64.zip
      #       redot-macos-x64.zip
      #       redot-macos-arm64.zip
      #       redot-linux-template.zip
      #       redot-windows-template.zip
      #       redot-macos-x64-template.zip
      #       redot-macos-arm64-template.zip

      - name: Upload dev build artifacts to GitHub dev
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || env.CURRENT_DATE }}
          name: ${{ inputs.tag_name || env.CURRENT_DATE }}
          draft: false
          make_latest: true
          files: |
            redot-linuxbsd.zip
            redot-windowsx64.zip
            redot-macos-x64.zip
            redot-macos-arm64.zip
            redot-linux-template.zip
            redot-windows-template.zip
            redot-macos-x64-template.zip
            redot-macos-arm64-template.zip
            redot-linux-mono.zip
            redot-linux-template-mono.zip
            redot-windows-mono.zip
            redot-windows-template-mono.zip
