name: 🧱 PhysX SDK Builds

on:
  workflow_dispatch:
    inputs:
      physx_ref:
        description: "PhysX source ref (ovphysx-0.7.0 == PhysX SDK 5.12)"
        default: "ovphysx-0.7.0"
        required: false

# Builds the PhysX SDK for Linux x86_64 with CUDA GPU support, in both SDK
# configurations, from the ovphysx release tag:
#   checked  -> linked by editor / template_debug builds (default)
#   release  -> linked by template_release builds (physx_config=release)
#
# Per config the artifact contains:
#   - the CPU static libs (PhysX/Common/Foundation/Extensions/PvdSDK/
#     CharacterKinematic/Vehicle_static_64; PhysX 5.12 folded cooking into
#     PhysXCommon, so there is no separate Cooking lib anymore)
#   - PVDRuntime_static_64 (the Linux link line includes it)
#   - the shared GPU runtime built from source (libPhysXGpu_64.so) with
#     RUNPATH=$ORIGIN -- staged next to the engine binary at runtime. The
#     intermediate GPU solver static archives (BroadphaseGpu/SolverGpu/...)
#     are deliberately NOT collected: the Linux engine never links them, it
#     resolves its GPU dispatch entry points from the shared runtime.
#   - include/ (the SDK headers, for the thirdparty/physx/include update)
#
# PhysX only: Flow and Blast have their own pipelines and are NOT built here,
# and there is deliberately no Windows job (5.12 Windows libs are produced
# locally). macOS: PhysX upstream dropped macOS from its build system
# entirely; Linux ARM64 is unwired in the module's SCsub. Both absent.
#
# NOTE on build time: PX_GENERATE_GPU_REDUCED_ARCHITECTURES=False compiles
# the CUDA kernels for the full SM set -- expect a multi-hour job. Flip that
# switch to True in the preset below if a faster, reduced-arch build is
# acceptable.
#
# Drop-in after downloading the artifact:
#   out/checked/*.a  -> thirdparty/physx/lib/linux/x86_64/checked/
#   out/release/*.a  -> thirdparty/physx/lib/linux/x86_64/release/
#   out/<config>/libPhysXGpu_64.so -> thirdparty/physx/bin/linux/x86_64/release/
#   out/include/     -> thirdparty/physx/include/

jobs:
  build-linux-x86_64:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Free disk space (full-arch CUDA kernels are large)
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af > /dev/null 2>&1 || true
          df -h /

      - name: Install toolchain (clang / GCC / build tools)
        run: |
          sudo apt-get update -qq
          # clang 18 on noble is a supported nvcc 12.9 host compiler; GCC stays
          # installed as clang's libstdc++/linker backend.
          sudo apt-get install -y -qq clang lld gcc g++ cmake make python3 \
            patchelf curl ca-certificates > /dev/null
          clang --version | head -1
          gcc --version | head -1

      - name: Install CUDA Toolkit 12.9.2 (Update 2)
        run: |
          # Required: the GPU projects below cross-compile the CUDA kernels
          # here (no GPU or driver is needed on the runner). Network-repo
          # equivalent of NVIDIA's local .deb installer flow for CUDA 12.9.2
          # (12.9.2-575.57.08): same toolkit, same apt meta package
          # (cuda-toolkit-12-9).
          wget -q https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update -qq
          sudo apt-get install -y -qq cuda-toolkit-12-9
          echo "/usr/local/cuda/bin" >> "$GITHUB_PATH"

      - name: Verify CUDA toolchain
        run: |
          nvcc --version
          echo "CUDA_PATH=$(dirname "$(dirname "$(command -v nvcc)")")" >> "$GITHUB_ENV"

      - name: Checkout PhysX source
        uses: actions/checkout@v4
        with:
          repository: NVIDIA-Omniverse/PhysX
          ref: ${{ inputs.physx_ref }}

      - name: Write vendor preset
        run: |
          # Redot vendor preset: the vc17win64-rd preset carried to Linux, minus
          # PX_CMAKE_SUPPRESS_REGENERATION (an MSVC/zero_check-only switch; the
          # Linux make/ninja generators have no zero_check to suppress). The
          # two NV_USE_*_WINCRT switches are Windows-only CRT selections and
          # are carried verbatim as documented no-ops here.
          #
          # PX_GENERATE_GPU_PROJECTS=True builds the CUDA GPU components and
          # the shared libPhysXGpu_64.so runtime from source; the intermediate
          # GPU static archives it also emits are skipped by
          # collect_physx_libs.py (the Linux engine never links them -- the
          # shared runtime carries that functionality).
          cat > physx/buildtools/presets/public/linux-clang-rd-gpu.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <preset name="linux-clang-rd-gpu" comment="Linux clang PhysX SDK general settings __ Redot 2026">
            <platform targetPlatform="linux" compiler="clang" />
            <CMakeSwitches>
              <cmakeSwitch name="PX_BUILDSNIPPETS" value="False" comment="Generate the snippets" />
              <cmakeSwitch name="PX_BUILDPVDRUNTIME" value="True" comment="Generate the OmniPVD project" />
              <cmakeSwitch name="PX_GENERATE_STATIC_LIBRARIES" value="True" comment="Generate static libraries" />
              <cmakeSwitch name="PX_GENERATE_GPU_PROJECTS" value="True" comment="Generate the GPU projects, if possible." />
              <cmakeSwitch name="PX_GENERATE_GPU_PROJECTS_ONLY" value="False" comment="Generate ONLY the GPU projects, if possible." />
              <cmakeSwitch name="PX_CUDA_DEVICE_DEBUG" value="False" comment="Build debug CUDA device code with -G for single line stepping" />
              <cmakeSwitch name="PX_SCALAR_MATH" value="False" comment="Disable SIMD math" />
              <cmakeSwitch name="NV_USE_STATIC_WINCRT" value="True" comment="Windows-only CRT switch; no-op on Linux" />
              <cmakeSwitch name="NV_USE_DEBUG_WINCRT" value="False" comment="Windows-only CRT switch; no-op on Linux" />
              <cmakeSwitch name="PX_FLOAT_POINT_PRECISE_MATH" value="False" comment="Float point precise math" />
              <cmakeSwitch name="PX_GENERATE_GPU_STATIC_LIBRARIES" value="False" comment="Generate PhysXGPU static libraries" />
              <cmakeSwitch name="PX_GENERATE_GPU_REDUCED_ARCHITECTURES" value="False" comment="Generate only a reduced number of GPU architectures for faster compilation" />
            </CMakeSwitches>
            <CMakeParams>
              <cmakeParam name="CMAKE_INSTALL_PREFIX" value="install/linux-clang-rd-gpu/PhysX" comment="Install path relative to PhysX SDK root" />
            </CMakeParams>
          </preset>
          EOF

      - name: Generate build projects (packman pulls dependencies)
        run: |
          cd physx
          ./generate_projects.sh linux-clang-rd-gpu

      - name: Build checked and release configs
        run: |
          cd physx
          cmake --build compiler/linux-clang-rd-gpu-checked -j"$(nproc)"
          cmake --build compiler/linux-clang-rd-gpu-release -j"$(nproc)"

      - name: Checkout engine repo (collection script)
        uses: actions/checkout@v4
        with:
          path: engine

      - name: Collect libraries, shared runtimes and headers
        run: |
          python3 engine/.github/workflows/scripts/collect_physx_libs.py linux

      - name: Upload SDK artifact
        uses: actions/upload-artifact@v4
        with:
          name: physx-sdk-linux-x86_64
          path: out/
