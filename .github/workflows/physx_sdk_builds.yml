name: 🧱 PhysX SDK Builds

on:
  workflow_dispatch:
    inputs:
      physx_ref:
        description: "PhysX source ref (ovphysx-0.5.11 == PhysX SDK 5.11)"
        default: "ovphysx-0.5.11"
        required: false

# Builds the PhysX SDK static libraries for Linux x86_64 with CUDA GPU
# support, in both SDK configurations:
#   checked  -> linked by editor / template_debug builds (default)
#   release  -> linked by template_release builds (physx_config=release)
#
# The artifact is a superset of a CPU-only build: the eight core static
# libs plus the GPU set (PhysXCommonGpu/SolverGpu/..._static_64). The
# closed-source kernel runtime (libPhysXGpu_64.so) is NOT built here --
# NVIDIA ships it prebuilt inside the ovphysx release archives
# (plugins/); place that .so beside the engine binary at runtime.
#
# The module's SCsub currently links GPU libs on Windows only (its
# GODOT_PHYSX_GPU gate); the Linux GPU set is drawer stock until that
# wiring exists. macOS: PhysX 5.11 upstream dropped macOS from its
# build system entirely (no presets, no Darwin cmake handling), and
# Linux ARM64 is unwired in the SCsub -- both intentionally absent.
#
# Feed the downloaded artifact's out/checked and out/release folders
# into thirdparty/physx/lib/linux/x86_64/...

jobs:
  build-linux-x86_64-gpu:
    runs-on: ubuntu-latest
    container:
      image: nvidia/cuda:12.8.1-devel-ubuntu24.04
    steps:
      - name: Install toolchain
        run: |
          apt-get update -qq
          apt-get install -y -qq clang lld python3 git curl ca-certificates cmake make > /dev/null

      - name: Checkout PhysX source
        uses: actions/checkout@v4
        with:
          repository: NVIDIA-Omniverse/PhysX
          ref: ${{ inputs.physx_ref }}

      - name: Write vendor preset
        run: |
          # CPU-only vendor preset: the GPU archive's cudamanager references the
          # CUDA driver API directly (cuMemsetD8_v2...), which would make -lcuda
          # a hard link requirement nobody on CI can satisfy; CPU-only libs are
          # self-contained.
          cat > physx/buildtools/presets/public/linux-clang-rd.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <preset name="linux-clang-rd" comment="Linux clang PhysX SDK general settings (CPU only)">
            <platform targetPlatform="linux" compiler="clang" />
            <CMakeSwitches>
              <cmakeSwitch name="PX_BUILDSNIPPETS" value="False" comment="Generate the snippets" />
              <cmakeSwitch name="PX_BUILDPVDRUNTIME" value="False" comment="Generate the OmniPVD project" />
              <cmakeSwitch name="PX_GENERATE_STATIC_LIBRARIES" value="True" comment="Generate static libs" />
              <cmakeSwitch name="PX_GENERATE_GPU_PROJECTS" value="False" comment="Generate the GPU projects" />
              <cmakeSwitch name="PX_GENERATE_GPU_PROJECTS_ONLY" value="False" comment="Generate ONLY the GPU projects, if possible." />
              <cmakeSwitch name="PX_GENERATE_GPU_STATIC_LIBRARIES" value="False" comment="Generate PhysXGPU static libraries" />
              <cmakeSwitch name="PX_GENERATE_GPU_REDUCED_ARCHITECTURES" value="False" comment="Generate only a reduced number of GPU architectures for faster compilation" />
              <cmakeSwitch name="PX_SCALAR_MATH" value="False" comment="Disable SIMD math" />
              <cmakeSwitch name="PX_FLOAT_POINT_PRECISE_MATH" value="False" comment="Float point precise math" />
            </CMakeSwitches>
            <CMakeParams>
              <cmakeParam name="CMAKE_INSTALL_PREFIX" value="install/linux-clang-rd/PhysX" comment="Install path relative to PhysX SDK root" />
            </CMakeParams>
          </preset>
          EOF

      - name: Generate build projects (packman pulls dependencies)
        run: |
          cd physx
          ./generate_projects.sh linux-clang-rd

      - name: Build checked and release configs
        run: |
          cd physx
          cmake --build compiler/linux-clang-rd-checked -j"$(nproc)"
          cmake --build compiler/linux-clang-rd-release -j"$(nproc)"

      - name: Checkout engine repo (collection script)
        uses: actions/checkout@v4
        with:
          path: engine

      - name: Collect static libraries
        run: |
          python3 engine/collect_physx_libs.py linux

      - name: Upload SDK artifact
        uses: actions/upload-artifact@v4
        with:
          name: physx-sdk-linux-x86_64
          path: out/
